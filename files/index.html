<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Aseo del Grupo</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="app-header">
    <h1 class="app-title">🧹 Aseo del Grupo</h1>
    <p id="week-label" class="week-label"></p>
  </header>

  <main class="app-main">

    <!-- Sección: Semana -->
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">Asignación Semanal</h2>
        <button id="btn-generate" class="btn btn-primary">⚡ Generar semana</button>
      </div>
      <div id="week-container"></div>
    </section>

    <!-- Sección: Integrantes -->
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">Integrantes del Grupo</h2>
        <button id="btn-clear" class="btn btn-ghost">🗑 Limpiar todo</button>
      </div>

      <form id="add-member-form" class="add-form">
        <input
          id="member-name-input"
          type="text"
          placeholder="Nombre del integrante..."
          class="input-field"
          maxlength="40"
          required
        />
        <button type="submit" class="btn btn-primary">+ Agregar</button>
      </form>

      <div id="member-list"></div>
    </section>

  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
